<head>
	<link rel="stylesheet" href="Jobstyle.css">
    <!-- <center><h1 style="font-size: 600%;">Welcome! Employers</h1></center> -->
</head>
<body>

   

	<div class="container">
    
        <form id="registration-form" action="/aspirant" method="post">
            
           
			<h1>Jobseekers</h1>
            <div class="form-group">
                <label for="Eligibility">Qualification</label>
                            
                <input type="text" id="Qualification" name="Qualification" required>
            </div>
			<div class="form-group">
                <label for="Registered_Number">Number</label>
                            
                <input type="Number" id="Registered_Number" name="Registered_Number" required>
            </div>
			<h1>Job</h1>
		
			<div class="form-group">
                <label for="Job_Name:">Job_Name</label>
                <input type="text" id="Job_Name" name="Job_Name" required>
            </div>
			<div class="form-group">
                <label for="Job_Name:">Name:</label>
                <input type="text" id="Name" name="Name" required>
            </div>
            <div class="form-group">
                <label for="Number">Company</label>
                            
                <input type="text" id="Company" name="Company" required>
            </div>
           
            <div class="form-group">
                <label for="Salary">Salary:</label>
                <input type="Number" id="Salary" name="Salary" required>
            </div>
			<div class="form-group">
                <label for="Location">Location</label>
                <input type="text" id="Location" name="Location" required>
            </div>
			<button type="submit">Register</button>
            </div>
        </form>
    </div>
</body>
