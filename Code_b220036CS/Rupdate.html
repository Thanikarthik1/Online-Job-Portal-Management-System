	<link rel="stylesheet" href="Jobstyle.css">

</head>
<body>

   

	<div class="container">
        <h1>Job Profile</h1>
        <form id="registration-form" action="/Rupdate" method="post">
            <div class="form-group">
                <label for="Job_Name:">Job_Name</label>
                <input type="text" id="Job_Name" name="Job_Name" required>
            </div>
			<div class="form-group">
                <label for="Job_Name:">Name:</label>
                <input type="text" id="Name" name="Name" required>
            </div>
            <div class="form-group">
                <label for="Number">Company</label>
                            
                <input type="text" id="Company" name="Company" required>
            </div>
			<div class="form-group">
                <label for="Location">Location</label>
                <input type="text" id="Location" name="Location" required>
            </div>
            <div class="form-group">
                <label for="Eligibility">Qualification</label>
                            
                <input type="text" id="Qualification" name="Qualification" required>
            </div>
			<div class="form-group">
                <label for="Age">Age</label>
                            
                <input type="Number" id="Age" name="Age" required>
            </div>
			<div class="form-group">
                <label for="Registered_Number">Current Registered_Number</label>
                            
                <input type="Number" id="Registered_Number" name="Registered_Number" required>
            </div>
			<button type="submit">Register</button>
            </div>
        </form>
    </div>
</body>
