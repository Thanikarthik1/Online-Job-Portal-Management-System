<body>

   

	<div class="container">
        <h1>Sending a Hiring Request to the Aspirant</h1>
        <form id="registration-form" action="/Hired" method="post">
            
            
            <div class="form-group">
                <label for="Number">Company</label>
                            
                <input type="text" id="Company" name="Company" required>
            </div>
            
            
			<div class="form-group">
                <label for="Registered_Number">Registered_Number</label>
                            
                <input type="Number" id="Registered_Number" name="Registered_Number" required>
            </div>
			<button type="submit">Hire</button>
            </div>
        </form>
    </div>
</body>
