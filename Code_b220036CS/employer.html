<head>
	<link rel="stylesheet" href="Jobstyle.css">
    <!-- <center><h1 style="font-size: 600%;">Welcome! Employers</h1></center> -->
</head>
<body>

   

	<div class="container">
        <h1>Job</h1>
        <form id="registration-form" action="/employer" method="post">
            
            <div class="form-group">
                <label for="Job_Name:">Job_Name</label>
                <input type="text" id="Job_Name" name="Job_Name" required>
            </div>
            <div class="form-group">
                <label for="Number">Company</label>
                            
                <input type="text" id="Company" name="Company" required>
            </div>
           
            <div class="form-group">
                <label for="Salary">Salary:</label>
                <input type="Number" id="Salary" name="Salary" required>
            </div>
			<div class="form-group">
                <label for="Location">Location</label>
                <input type="text" id="Location" name="Location" required>
            </div>
            <div class="form-group">
                <label for="Eligibility">Eligibility</label>
                            
                <input type="text" id="Eligibility" name="Eligibility" required>
            </div>
			<div class="form-group">
                <label for="Deadline">Deadline to apply</label>
                            
                <input type="Date" id="Deadline" name="Deadline" required>
            </div>
			<div class="form-group">
                <label for="Registered_Number">Number</label>
                            
                <input type="Number" id="Registered_Number" name="Registered_Number" required>
            </div>
			<button type="submit">Provide</button>
            </div>
        </form>
    </div>
</body>
